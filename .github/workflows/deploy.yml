name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The wasm relinker strips unused runtime code from dotnet.native.wasm; without
      # this workload the publish logs a warning and ships the fatter runtime.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish Duniverse.Web/Duniverse.Web.csproj -c Release -o release --nologo

      - name: Add .nojekyll, CNAME, and SPA fallback
        run: |
          touch release/wwwroot/.nojekyll
          echo 'www.duniverse.org' > release/wwwroot/CNAME
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot
          # Since v4 the artifact drops dotfiles unless told otherwise, and .nojekyll
          # above is one; keep the artifact's contents identical to what v3 shipped.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
