name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The wasm relinker strips unused runtime code from dotnet.native.wasm; without
      # this workload the publish logs a warning and ships the fatter runtime.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # In Release, the same configuration the site ships in. The debug validators
      # compile away out there, so this is where the spoiler promises get enforced.
      - name: Test
        run: dotnet test Duniverse.Tests/Duniverse.Tests.csproj -c Release --nologo

      - name: Publish
        run: dotnet publish Duniverse.Web/Duniverse.Web.csproj -c Release -o release --nologo

      # Runs before the prerenderer on purpose. 404.html is what Pages serves for a genuinely
      # unknown address, so it has to be the plain shell: copy it after prerendering and every
      # dead URL would answer with the home page's title and a canonical pointing at the front
      # door. Routes the app really has get their own file in the next step instead.
      - name: Add .nojekyll, CNAME, and SPA fallback
        run: |
          touch release/wwwroot/.nojekyll
          echo 'www.duniverse.org' > release/wwwroot/CNAME
          cp release/wwwroot/index.html release/wwwroot/404.html

      # Writes a real index.html for every route the app can serve, so Pages answers each one
      # with a 200 instead of falling through to that 404. Has to run after publish, because it
      # reads the published shell to pick up the fingerprinted boot script. It rewrites
      # sitemap.xml from the same walk, so the sitemap cannot drift from what actually exists.
      - name: Prerender routes
        run: dotnet run --project Duniverse.Prerender/Duniverse.Prerender.csproj -c Release -- release/wwwroot

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot
          # Since v4 the artifact drops dotfiles unless told otherwise, and .nojekyll
          # above is one; keep the artifact's contents identical to what v3 shipped.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
