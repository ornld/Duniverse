<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Search crawlers never actually run the app, so this title is the only one they will
         ever see. It reads a little long for a browser tab, but the app swaps in its own
         titles the moment it boots. -->
    <title>Duniverse, an unofficial Dune encyclopedia</title>
    <base href="/" />

    <!-- The whole site renders client side. Anything that doesn't run scripts (crawlers, link
         previews) only ever sees this file, so the site's description has to live right here
         instead of in any page. -->
    <!-- The deploy copies this file to 404.html so routing works on GitHub Pages. That means
         deep links get served with a 404 status and can't be indexed anyway, so the canonical
         tag below really only matters for the home page. -->
    <meta name="description" content="An unofficial encyclopedia of Frank Herbert's Dune and its Expanded Universe. Search every record, follow the connections, and read it without spoilers." />
    <link rel="canonical" href="https://www.duniverse.org/" />
    <meta name="theme-color" content="#0f0d0c" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Duniverse" />
    <meta property="og:title" content="Duniverse, an unofficial Dune encyclopedia" />
    <meta property="og:description" content="An unofficial encyclopedia of Frank Herbert's Dune and its Expanded Universe. Search every record, follow the connections, and read it without spoilers." />
    <meta property="og:url" content="https://www.duniverse.org/" />
    <meta property="og:image" content="https://www.duniverse.org/images/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A great hall hung with red and gold banners, lined with guards, a small figure enthroned at the far end." />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@notlukearnold" />
    <meta name="twitter:title" content="Duniverse, an unofficial Dune encyclopedia" />
    <meta name="twitter:description" content="An unofficial encyclopedia of Frank Herbert's Dune and its Expanded Universe. Search every record, follow the connections, and read it without spoilers." />
    <meta name="twitter:image" content="https://www.duniverse.org/images/og-card.jpg" />
    <meta name="twitter:image:alt" content="A great hall hung with red and gold banners, lined with guards, a small figure enthroned at the far end." />

    <!-- The vector one first: browsers that understand it get a mark that stays sharp at
         any tab size and on any screen, and the rest fall through to the png below. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Without this, saving the site to an iPhone home screen uses a screenshot as the icon.
         This gives it the same icon the browser tab already has. -->
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preload" href="fonts/marcellus-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Only Home and About use this background image, but every route serves this same file.
         A normal preload tag would download it on the ten pages that never show it, so this
         little script only preloads it on those two. The download still starts long before
         the app boots, which is what keeps the hero art from popping in late. -->
    <script>
        (function () {
            const path = location.pathname.replace(/\/+$/, '') || '/';
            if (path !== '/' && path !== '/about') {
                return;
            }
            const preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'image';
            preload.href = 'images/main-menu-background.webp';
            document.head.appendChild(preload);
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="Duniverse.Web.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app"></div>

    <!-- The loading screen sits OUTSIDE #app on purpose, and that is a load-bearing choice.
         Inside it, Blazor's first render wiped the whole container in a single frame, which
         is why the old boot screen vanished rather than ended. Out here it outlives that
         render, so the storm can break over a page that is already sitting behind it.

         The cost is that nothing takes it down automatically any more. The script at the
         foot of this file owns that, and if it ever fails to run, every visitor gets a blank
         screen over a working site. It is written to come down on every path: on success, on
         a boot that throws, and on a timer that does not care which happened.

         The gold seam is still a real progress bar, its width tracking
         --blazor-load-percentage, and the storm is driven from the same number. -->
    <div class="boot-screen" id="boot-screen">
        <canvas class="boot-sand" id="boot-sand" aria-hidden="true"></canvas>
        <div class="boot-stage">
            <div class="boot-wordmark">Duniverse</div>
            <div class="boot-seam">
                <div class="boot-seam-fill"></div>
            </div>
            <p class="boot-line">Opening the archives</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/nav-sand.js"></script>
    <script src="js/universe-pan.js"></script>
    <script src="js/deep-link.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <!-- GitHub Pages won't compress the framework files, so a first visit would be a
         ~7 MB download. The build already makes a Brotli copy of each file at about a third
         the size, so this fetches those instead and decodes them in the browser
         (decode.min.js is Google's decoder, MIT licensed). On localhost the dev server
         handles compression itself and never makes the .br files, so all of this steps
         aside during development. -->
    <!-- Decoding those files takes real time on every visit, and GitHub Pages caps browser
         caching at ten minutes, so the normal cache can't carry that work between visits.
         This saves the decoded bytes in Cache Storage instead, keyed by each file's URL, so
         a repeat visit skips the fetch and the decode entirely. The filenames change
         whenever their contents change, so a cached name can never hold stale bytes. Every
         cache step is optional: if storage is missing or says no, it falls back to the
         fetch-and-decode path above. Once boot settles it cleans out entries this visit
         never asked for, so dead builds don't pile up. A boot that never finishes throws
         the cache away and retries once, so nobody gets stuck holding a bad entry. -->
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';

        const CACHE_NAME = 'duniverse-boot-v1';

        // The dev server negotiates compression itself and its build output holds no .br twins at
        // all, so on any local origin the hook has to step aside completely or boot dies on a 404.
        // Hostname is a blunt test, but the alternative is probing for a twin on every visit and
        // the deployed domain is the only host that ever needs the production path. Matching the
        // bare word 'localhost' was not enough on its own: the loopback address typed as a number,
        // and the machine's LAN address used to check the site on a phone, both fell through to
        // the Brotli path and left the boot screen up with nothing to explain it.
        const host = location.hostname;
        const isLocal = ['localhost', '127.0.0.1', '[::1]', '::1'].includes(host)
            || host.endsWith('.local')
            || /^(10|127|192\.168|172\.(1[6-9]|2\d|3[01]))\.[\d.]+$/.test(host);

        // The absolute URLs this visit actually asked for, so the post-boot prune can tell a
        // live fingerprint from an abandoned one.
        const requested = new Set();

        // Opened once and shared. Cache Storage is absent in non-secure contexts and can throw
        // in some private-browsing modes, so any failure here resolves to null and every caller
        // simply treats caching as unavailable and stays on the network path.
        let cachePromise;
        function openBootCache() {
            if (cachePromise === undefined) {
                cachePromise = (async () => {
                    try {
                        return self.caches ? await caches.open(CACHE_NAME) : null;
                    } catch {
                        return null;
                    }
                })();
            }
            return cachePromise;
        }

        // A hit is rebuilt from its stored bytes rather than handed back as-is, so the
        // content-type is always the one this boot expects. The length check catches an empty or
        // truncated body and nothing further: it is measured against a header written from these
        // same bytes, so it cannot notice a body of the right size holding the wrong content.
        // Handing the runtime a Response also skips its own integrity check, which is why the
        // only thing standing behind this is the recovery reload at the foot of the file. Any
        // error reading the cache is treated as a miss.
        async function readFromCache(cache, key, contentType) {
            if (!cache) {
                return undefined;
            }
            try {
                const hit = await cache.match(key);
                if (!hit) {
                    return undefined;
                }
                const buffer = await hit.arrayBuffer();
                const expected = Number(hit.headers.get('x-decoded-length'));
                if (buffer.byteLength === 0 || buffer.byteLength !== expected) {
                    return undefined;
                }
                return new Response(buffer, { headers: { 'content-type': contentType } });
            } catch {
                return undefined;
            }
        }

        // Storing is best-effort and never awaited on the boot path: a full quota or any other
        // rejection is swallowed, since failing to remember a resource is not failing to serve it.
        function writeToCache(cache, key, response) {
            if (!cache) {
                return;
            }
            try {
                cache.put(key, response).catch(() => {});
            } catch {
                // A synchronous throw (an unusable cache handle) is as harmless as a rejection.
            }
        }

        // Runs once boot has settled and off the critical path. Every stored entry this visit
        // did not request belongs to a superseded fingerprint, so it is deleted and the cache
        // tracks the current build instead of growing without bound.
        async function pruneBootCache() {
            const cache = await openBootCache();
            if (!cache) {
                return;
            }
            try {
                // Bumping CACHE_NAME abandons the whole previous cache, several megabytes of
                // decoded payload nothing will read again, so earlier versions go first. Browsers
                // evict an origin's storage all at once, and a bucket weighed down by dead builds
                // is one that takes the live entries with it when it goes.
                const names = await caches.keys();
                await Promise.all(names
                    .filter(name => name.startsWith('duniverse-boot-') && name !== CACHE_NAME)
                    .map(name => caches.delete(name).catch(() => {})));

                const keys = await cache.keys();
                await Promise.all(keys.map(request =>
                    requested.has(request.url) ? undefined : cache.delete(request).catch(() => {})));
            } catch {
                // Leaving stale entries in place is a storage cost, never a correctness problem.
            }
        }

        // ---- The boot storm ------------------------------------------------------------
        // Sand drifts across while the runtime downloads, thickens as the load lands, and
        // breaks over the page once the app is up.
        //
        // It plays in full on a first visit and otherwise only while there is a real wait to
        // cover. Ceremony on this site happens once and is remembered, the way the spoiler
        // ritual asks once: a reader who came back should never be made to stand through
        // weather for a page that is already cached and ready.
        const STORM_KEY = 'duniverse.storm.v1';
        const bootScreen = document.getElementById('boot-screen');
        const bootBegan = performance.now();

        let firstEver = true;
        try {
            firstEver = !localStorage.getItem(STORM_KEY);
        } catch {
            // Storage that will not answer is treated as a first visit. Erring toward the
            // ceremony is the harmless direction; erring away from it hides the feature.
        }

        const wantsCalm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const inertStorm = {
            setIntensity: function () { },
            clear: function () { return Promise.resolve(); },
            stop: function () { }
        };
        const storm = (!wantsCalm && window.duneNav && window.duneNav.sandStorm)
            ? window.duneNav.sandStorm(document.getElementById('boot-sand'))
            : inertStorm;

        // Read from the same custom property the seam is drawn from, so the weather and the
        // bar can never disagree about how far along the load actually is.
        function loadFraction() {
            const raw = getComputedStyle(document.documentElement)
                .getPropertyValue('--blazor-load-percentage');
            const n = parseFloat(raw);
            return Number.isFinite(n) ? n / 100 : 0;
        }

        const stormPump = wantsCalm
            ? 0
            : setInterval(function () { storm.setIntensity(loadFraction()); }, 100);

        let bootScreenDown = false;
        function takeDownBootScreen() {
            if (bootScreenDown) {
                return;
            }
            bootScreenDown = true;
            clearInterval(stormPump);
            storm.stop();
            if (bootScreen && bootScreen.parentNode) {
                bootScreen.parentNode.removeChild(bootScreen);
            }
        }

        // The guarantee. Whatever else happens above, the screen comes down. Twenty seconds
        // is far longer than any real boot and far shorter than a visitor's patience with a
        // page that never arrives.
        setTimeout(takeDownBootScreen, 20000);

        const started = Blazor.start({
            loadBootResource: (type, name, defaultUri, integrity) => {
                if (type === 'dotnetjs' || type === 'manifest' || type === 'configuration') {
                    // The runtime's own script must load as a URL, not a Response.
                    return defaultUri;
                }
                if (isLocal) {
                    return undefined;
                }
                return (async function () {
                    const contentType = type === 'dotnetwasm' ? 'application/wasm' : 'application/octet-stream';
                    const key = new URL(defaultUri, document.baseURI).href;
                    requested.add(key);

                    const cache = await openBootCache();
                    const cached = await readFromCache(cache, key, contentType);
                    if (cached) {
                        return cached;
                    }

                    const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                    if (!response.ok) {
                        throw new Error(response.statusText);
                    }
                    const buffer = await response.arrayBuffer();
                    const decompressed = BrotliDecode(new Int8Array(buffer));
                    const fresh = new Response(decompressed, {
                        headers: { 'content-type': contentType, 'x-decoded-length': String(decompressed.length) }
                    });
                    // Clone before returning: the app consumes the original body, the cache the copy.
                    writeToCache(cache, key, fresh.clone());
                    return fresh;
                })();
            }
        });

        // The storm breaks and the screen lifts. Kept as its own chain so a failure here can
        // never take the cache prune or the art warm-up down with it, and the other way round.
        started.then(async function () {
            try {
                localStorage.setItem(STORM_KEY, '1');
            } catch {
                // A reader whose storage is closed sees the full storm every time. That is a
                // worse outcome than remembering, and still a working site.
            }

            // A first visit is worth a moment even on a fast connection. A return visit is
            // not, so the floor drops to nothing and the storm only ever covers a real wait.
            const held = performance.now() - bootBegan;
            const floor = (firstEver && !wantsCalm) ? 2000 : 0;
            if (held < floor) {
                await new Promise(function (r) { setTimeout(r, floor - held); });
            }

            storm.setIntensity(1);

            // Raced rather than awaited. A backgrounded tab stops firing animation frames, so
            // the clear would never resolve and the screen would sit over a site that had
            // finished loading minutes ago.
            await Promise.race([
                storm.clear(firstEver ? 900 : 380),
                new Promise(function (r) { setTimeout(r, 1600); })
            ]);

            if (bootScreen) {
                bootScreen.classList.add('boot-lifting');
            }
            setTimeout(takeDownBootScreen, 420);
        }).catch(takeDownBootScreen);

        // The stored bytes are only ever length-checked, so a cache entry that is wrong rather
        // than short is handed to the runtime and boot never finishes. A hard reload does not
        // touch Cache Storage, so left alone that visitor meets the same dead boot screen on
        // every future visit and only clearing site data by hand would free them. The cache is
        // the one thing this page can throw away, so a failed start throws it away and retries.
        // The session flag holds the retry to one attempt, which means a boot that is broken for
        // any other reason fails the second time and stays failed instead of reloading forever.
        const RETRY_FLAG = 'duniverse-boot-retry';
        async function retryWithoutCache() {
            try {
                if (!self.caches || sessionStorage.getItem(RETRY_FLAG)) {
                    return;
                }
                sessionStorage.setItem(RETRY_FLAG, '1');
                await caches.delete(CACHE_NAME);
                location.reload();
            } catch {
                // Storage that refuses to answer had nothing worth blaming in it either.
            }
        }

        // Cache maintenance waits for boot and then for the main thread to fall idle, so it never
        // competes with the app's first frame. Skipped on a local origin so a cached build cannot
        // haunt local dev.
        if (!isLocal) {
            started.then(() => {
                try {
                    // Cleared on success so a later bad entry in this same tab still gets its one
                    // retry rather than inheriting a spent flag.
                    sessionStorage.removeItem(RETRY_FLAG);
                } catch {
                    // Nothing to clear if storage is unavailable.
                }
                if (window.requestIdleCallback) {
                    requestIdleCallback(() => pruneBootCache());
                } else {
                    setTimeout(() => pruneBootCache(), 3000);
                }
            }).catch(() => retryWithoutCache());
        }

        // Every tab paints its hero over one of a handful of photographs, and the first
        // visit to a tab used to pay for that photograph's download on the spot: a beat
        // of bare grain before the art arrived. Once boot settles and the thread goes
        // idle, walk the set in nav order and let the browser's cache take them, one at
        // a time so the warm-up never crowds a request the visitor makes mid-list. The
        // landing page's own art tops the list and resolves instantly from cache, and a
        // reader who asked their connection for less data keeps that bargain: the
        // warm-up stands down. Category art stays out of the list; those pages sit two
        // clicks deep and their heaviest file outweighs any hero here.
        const heroArt = [
            '/images/main-menu-background.webp',
            '/images/entity-front-background.webp',
            '/images/timelinebackground.webp',
            '/images/entity-graph-background.webp',
            '/images/terminology.webp',
            '/images/sayingsbackground.webp',
            '/images/entity-back-background.webp',
        ];
        function warmHeroArt() {
            if (navigator.connection && navigator.connection.saveData) {
                return;
            }
            let next = 0;
            const step = () => {
                if (next >= heroArt.length) {
                    return;
                }
                const img = new Image();
                img.onload = img.onerror = () => step();
                img.src = heroArt[next++];
            };
            step();
        }
        started.then(() => {
            if (window.requestIdleCallback) {
                requestIdleCallback(() => warmHeroArt());
            } else {
                setTimeout(() => warmHeroArt(), 3500);
            }
        }).catch(() => {});
    </script>
</body>

</html>
