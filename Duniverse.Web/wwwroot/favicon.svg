<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
    <title>Duniverse</title>
    <!-- Twin moons over a dune. Drawn in a 16 box rather than shrunk into one, so it is
         built at the size it actually has to survive.

         The sand lies low on the left where the moons hang, rises the long way across,
         and settles into a broad flat crown before easing down to the right. The crown is
         deliberately wide and level: an earlier version peaked to a point, and a point
         reads as a mountain, not as sand. Both curves meet the crown horizontally, so
         there is no corner anywhere along the top. -->
    <rect width="16" height="16" rx="3" fill="#0f0d0c"/>
    <circle cx="4.6" cy="7.1" r="3" fill="#d9cdb6"/>
    <circle cx="12.4" cy="3.8" r="1.6" fill="#b0a288"/>
    <path d="M0 13.4 C 3 13.3, 5.6 12.9, 8 11.4 C 9.4 10.5, 11 9.6, 12.6 9.6 C 13.8 9.6, 14.9 10, 16 10.6 L 16 16 L 0 16 Z" fill="#4a3a28"/>
    <!-- Moonlight catching the crest, the same gold the footer horizon uses. -->
    <path d="M0 13.4 C 3 13.3, 5.6 12.9, 8 11.4 C 9.4 10.5, 11 9.6, 12.6 9.6 C 13.8 9.6, 14.9 10, 16 10.6" fill="none" stroke="#e0a458" stroke-width="0.7"/>
</svg>
